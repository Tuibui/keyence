<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GL-R · raw /gl_r/status</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/roslib@1.3.0/build/roslib.min.js"></script>
</head>
<body>
  <header>
    <h1>GL-R&nbsp;·&nbsp;<code>/gl_r/status</code></h1>
    <div class="meta">
      <span id="conn" class="pill bad">disconnected</span>
      <span id="hz" class="pill">— Hz</span>
      <span id="age" class="pill">age —</span>
      <span id="blocked" class="pill">0/0</span>
    </div>
  </header>

  <main>
    <!-- raw per-beam bitmap, LSB = beam 0 -->
    <section class="card">
      <h2>beam bitmap <span class="hint">index · 1=blocked / 0=clear</span></h2>
      <div id="strip"></div>
      <div class="legend">
        <span><i class="sw clear"></i>clear (0)</span>
        <span><i class="sw blocked"></i>blocked (1)</span>
        <span><i class="sw stale"></i>stale</span>
        <span><i class="sw fault"></i>fault</span>
      </div>
    </section>

    <aside>
      <!-- decoded message fields, raw values -->
      <section class="card">
        <h2>fields</h2>
        <dl id="fields"></dl>
      </section>

      <!-- reconstructed bitmap (matches NU-EP1 byte layout, LSB=beam0) -->
      <section class="card">
        <h2>bitmap bytes <span class="hint">LSB = beam 0</span></h2>
        <div class="kv"><span>hex</span><code id="hex">—</code></div>
        <div class="kv"><span>bin</span><code id="bin">—</code></div>
      </section>

      <!-- full raw message -->
      <section class="card">
        <h2>raw message</h2>
        <pre id="json">—</pre>
      </section>
    </aside>
  </main>

  <footer>
    <label>rosbridge ws://<input id="host" value="" size="16" />:<input id="port" value="9090" size="5" /></label>
    <button id="connect">connect</button>
    <span class="grow"></span>
    <span class="muted">topic <code>/gl_r/status</code> · <code>keyence_glr_msgs/msg/CurtainStatus</code></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
