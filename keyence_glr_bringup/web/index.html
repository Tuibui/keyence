<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Keyence GL-R · Beam Status</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/roslib@1.3.0/build/roslib.min.js"></script>
</head>
<body>
  <header>
    <h1>Keyence GL-R · Beam Status</h1>
    <div class="meta">
      <span id="conn" class="pill bad">disconnected</span>
      <span id="hz" class="pill">— Hz</span>
      <span id="blocked" class="pill">0 / 0 blocked</span>
      <span id="ossd" class="pill">OSSD —</span>
    </div>
  </header>

  <main>
    <section id="strip"></section>
    <section id="table-wrap">
      <table id="table">
        <thead><tr><th>#</th><th>state</th><th>health</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>
  </main>

  <footer>
    <label>rosbridge ws://<input id="host" value="" size="20" />:<input id="port" value="9090" size="5" /></label>
    <button id="connect">connect</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
