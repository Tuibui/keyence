# Keyence GL-R52H via NU-EP1 (EtherNet/IP) — driver config
#
# GL-R52H = 52 optical axes (beams).  beam_count MUST be 52 for this model.
# assembly_* come from the NU-EP1 unit (fixed 12-byte input assembly:
#   bytes 0-1 status word, bytes 2-9 64-bit beam bitmap, bytes 10-11 blocked count).
# The NU-EP1 bitmap is a fixed 8 bytes regardless of model; bits 52-63 are
# unused for the R52H, so beam_count=52 simply ignores them.
# ip_address = the GC1000/NU-EP1 device IP (see network setup), not the Jetson.
keyence_glr_driver:
  ros__parameters:
    ip_address: "192.168.0.10"
    assembly_instance: 100
    assembly_size: 12
    beam_count: 52
    poll_hz: 20.0
    frame_id: "gl_r"
    stale_timeout_s: 0.5
